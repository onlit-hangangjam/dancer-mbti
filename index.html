/* Layout: one phone-width column, a full-bleed river band on top; questions as a story, result as a ticket-like card */
:root {

  --font-code: "IBM Plex Mono", ui-monospace, Menlo, monospace;

/* Always light: same colors in dark mode; "only light" also asks browsers not to auto-darken */
:root { color-scheme: only light; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere; }

h1, h2, h3 { font-family: var(--font-display); font-weight: 400; text-wrap: balance; margin: 0; letter-spacing: 0.01em; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid var(--river); outline-offset: 2px; }

/* Intro */
.band { position: relative; border-radius: 20px; padding: 28px 22px 24px; background: var(--ink); color: var(--bg); overflow: hidden; display: flex; flex-direction: column; gap: 14px; }
.band::after { content: ""; position: absolute; left: -10%; right: -10%; bottom: -30px; height: 90px; background: repeating-linear-gradient(170deg, transparent 0 14px, color-mix(in srgb, var(--river) 55%, transparent) 14px 18px); opacity: 0.55; pointer-events: none; }
.eyebrow { font-family: var(--font-code); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; }
.band .eyebrow { color: var(--tape); }
.band h1 { font-size: clamp(34px, 10vw, 46px); line-height: 1.1; }
.band p { color: color-mix(in srgb, var(--bg) 82%, transparent); max-width: 34ch; position: relative; z-index: 1; }
.band .lead { font-weight: 700; font-size: 17px; color: var(--bg); }
.band p { white-space: pre-line; }
.genres { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; position: relative; z-index: 1; }
.genres figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.genres figcaption { font-size: 11px; color: color-mix(in srgb, var(--bg) 80%, transparent); white-space: nowrap; }

/* Octagon sign: blue plate, white dancer */
.sign { --size: 100%; position: relative; width: var(--size); height: auto; aspect-ratio: 1; background: var(--sign); clip-path: polygon(29.3% 0, 70.7% 0, 100% 29.3%, 100% 70.7%, 70.7% 100%, 29.3% 100%, 0 70.7%, 0 29.3%); flex: none; }
.sign img { position: absolute; inset: 0; margin: auto; width: 72%; height: 66%; object-fit: contain; display: block; }

/* Question scene: props drawn in SVG, dancers as masked silhouettes tinted by theme */
.scene { position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 14px; background: var(--scene); overflow: hidden; }
.scene svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.fig { position: absolute; display: block; background: var(--ink); -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: center bottom; mask-position: center bottom; }
.fig.flip { transform: scaleX(-1); }
.fig.me { background: var(--accent); }
.scene .p1 { fill: var(--river); }
.scene .p1s { fill: var(--river); opacity: .28; }
.scene .p2 { fill: var(--tape); }
.scene .p2s { fill: var(--tape); opacity: .45; }
.scene .p3 { fill: var(--accent); }
.scene .pl { fill: var(--card); }
.scene .pk { fill: none; stroke: var(--river); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.scene .pt { fill: var(--ink); font-family: var(--font-display); }
.scene .pw { fill: #ffffff; font-family: var(--font-display); }
.bubble { position: absolute; background: var(--card); color: var(--ink); border: 1.5px solid var(--ink); border-radius: 10px; font-size: 12px; font-weight: 700; padding: 1px 7px; line-height: 1.5; white-space: nowrap; }

.ghost { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 12px 16px; font-weight: 500; }
.note { font-size: 13px; color: var(--muted); text-align: center; }

/* Question */

.back { align-self: flex-start; border: 0; background: none; color: var(--muted); padding: 4px 0; font-size: 14px; }

.ticket { background: var(--card); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; }

.ticket-body { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.line { font-size: 18px; font-weight: 700; line-height: 1.5; }
.reason { color: var(--muted); }
.facts { display: grid; grid-template-columns: 4.5em 1fr; gap: 8px 12px; margin: 0; }
.facts dt { font-size: 13px; color: var(--muted); padding-top: 2px; }
.facts dd { margin: 0; min-width: 0; }
.section { display: flex; flex-direction: column; gap: 10px; }
.section > h3 { font-size: 20px; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pcard { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.pcard .eyebrow { font-size: 11px; }
.pcard.good .eyebrow { color: var(--river); }
.pcard.bad .eyebrow { color: var(--accent); }
.pcard strong { font-family: var(--font-display); font-weight: 400; font-size: 24px; }
.pcard .who { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }

.pcard .sign { --size: 48px; }
.pcard p { font-size: 14px; color: var(--muted); }
.mission { background: var(--ink); color: var(--bg); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.mission .eyebrow { color: var(--tape); }
.mission h3 { font-size: 22px; }
.mission dl { display: grid; grid-template-columns: 4.5em 1fr; gap: 8px 12px; margin: 0; }
.mission dt { font-size: 13px; color: color-mix(in srgb, var(--bg) 65%, transparent); padding-top: 2px; }

.field label { font-size: 13px; color: var(--muted); }

  function scene(i) {
    var s = SCENES[i]; if (!s) return "";
    return '<div class="scene" aria-hidden="true"><svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice">' + s.svg + "</svg>" + s.figs() + "</div>";
  }
  var draft = null;          // editor copy of DATA
  var state = { screen: "intro", i: 0, answers: [], code: null };
  var canEdit = false, editing = false, artifactApi = null;
  var app = document.getElementById("app");

  function D() { return editing && draft ? draft : DATA; }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  /* Line breaks: new line after each sentence (. ! ?); a long sentence with commas splits once at the comma nearest its middle */
  var LONG = 20;
  function splitComma(t) {
    if (t.length <= LONG) return [t];
    var best = -1, mid = t.length / 2, re = /, /g, m;
    while ((m = re.exec(t))) { if (best < 0 || Math.abs(m.index - mid) < Math.abs(best - mid)) best = m.index; }
    return best < 0 ? [t] : [t.slice(0, best + 1), t.slice(best + 2)];
  }
  function br(s) {
    var parts = String(s == null ? "" : s).split(/(?<=[.!?])\s+/), out = [];
    parts.forEach(function (p) { out = out.concat(splitComma(p)); });
    var plain = esc(s), alt = out.map(esc).join("<br>");
    return alt === plain ? plain : '<span class="br" data-alt="' + esc(alt) + '">' + plain + "</span>";
  }
  /* Keep text on one line when it fits; switch to the broken version only when it wraps */
  function fitBreaks() {
    Array.prototype.forEach.call(document.querySelectorAll(".br"), function (el) {
      if (!el.hasAttribute("data-plain")) el.setAttribute("data-plain", el.innerHTML);
      el.innerHTML = el.getAttribute("data-plain");
      if (el.getClientRects().length > 1) el.innerHTML = el.getAttribute("data-alt");
    });
  }
  window.addEventListener("resize", fitBreaks);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitBreaks);

  function scoreCode(answers) {
    var pairs = [["E", "I"], ["P", "F"], ["D", "X"]];
    return pairs.map(function (p) {
      var a = answers.filter(function (l) { return l === p[0]; }).length;
      var b = answers.filter(function (l) { return l === p[1]; }).length;
      return a >= b ? p[0] : p[1];
    }).join("");
  }

  function editBar() {
    if (!canEdit) return "";
    return '<div class="editbar">' + (editing
      ? '<button type="button" id="btn-close-edit">편집 닫기</button>'
      : '<button type="button" id="btn-edit">문구 편집</button>') + "</div>";
  }

  function renderIntro() {
    var d = D(), names = Object.keys(d.genres).map(function (k) { return "<figure>" + sign(k) + "<figcaption>" + esc(d.genres[k].name) + "</figcaption></figure>"; }).join("");
    return '<section class="band"><div class="eyebrow">' + esc(d.intro.eyebrow) + "</div>" + (d.intro.lead ? '<p class="lead">' + esc(d.intro.lead) + "</p>" : "") + "<h1>" + esc(d.intro.title) + "</h1>" + (d.intro.desc ? "<p>" + esc(d.intro.desc) + "</p>" : "") + '<div class="genres">' + names + "</div></section>" +

      '<p class="note">' + esc(d.intro.disclaimer) + "</p>";
  }

  function renderQuestion() {
    var d = D(), q = d.questions[state.i], n = d.questions.length, picked = state.answers[state.i];
    return '<div class="progress"><div class="bar"><i style="width:' + ((state.i + 1) / n * 100) + '%"></i></div><span class="count">' + (state.i + 1) + " / " + n + "</span></div>" +
      '<section class="qcard">' + scene(state.i) + '<div class="eyebrow" style="text-transform:none">Question.' + (state.i + 1) + "</div><h2>" + esc(q.q) + '</h2><div class="options">' +
      '<button type="button" class="opt' + (picked === q.aL ? " on" : "") + '" data-l="' + esc(q.aL) + '"><b>A</b><span>' + br(q.a) + "</span></button>" +
      '<button type="button" class="opt' + (picked === q.bL ? " on" : "") + '" data-l="' + esc(q.bL) + '"><b>B</b><span>' + br(q.b) + "</span></button>" +
      "</div></section>" + (state.i > 0 ? '<button type="button" class="back" id="btn-back">← 이전 질문</button>' : "");
  }

  function fact(label, value) { return value ? "<dt>" + esc(label) + "</dt><dd>" + br(value) + "</dd>" : ""; }

  function renderResult() {
    var d = D(), entry = d.codes[state.code] || { genre: Object.keys(d.genres)[0], tag: "" };
    var g = d.genres[entry.genre], m = d.genres[g.match], r = d.genres[g.rival], R = d.result;
        var mission = fact(R.missionOutfit, g.spotOutfit) + fact(R.missionMove, g.spotMove);
    return '<article class="ticket"><div class="ticket-top">' + sign(entry.genre) +
      "<h2>" + esc(g.name) + '</h2><div class="nick">' + esc(g.nick) + "</div></div>" +
      '<div class="punch"></div><div class="ticket-body"><p class="line">' + br(g.line) + '</p><p class="reason">' + br(g.reason) + "</p>" +
      '<dl class="facts">' + fact("성격", g.traits) + fact("음악", g.music) + "</dl></div></article>" +
      '<section class="section"><div class="pair">' +
      (m ? '<div class="pcard good"><div class="eyebrow">' + esc(R.matchLabel) + '</div><div class="who">' + sign(g.match) + "<strong>" + esc(m.name) + "</strong></div><p>" + br(g.matchWhy) + "</p></div>" : "") +
      (r ? '<div class="pcard bad"><div class="eyebrow">' + esc(R.rivalLabel) + '</div><div class="who">' + sign(g.rival) + "<strong>" + esc(r.name) + "</strong></div><p>" + br(g.rivalWhy) + "</p></div>" : "") +
      "</div></section>" +
      (mission ? '<section class="mission"><div class="eyebrow">' + esc(R.missionEyebrow) + "</div><h3>" + esc(R.missionTitle.replace("{genre}", g.name)) + "</h3><dl>" + mission + "</dl></section>" : "") +
      '<div class="row"><button type="button" class="ghost" id="btn-retry">' + esc(R.retry) + "</button></div>" +
      '<p class="note">' + esc(d.intro.disclaimer) + "</p>";
  }

  /* ---------- editor ---------- */
  function fieldList() {
    var d = draft, groups = [];
    groups.push({ title: "시작 화면", fields: [["intro.lead", "제목 위 한 줄"], ["intro.title", "제목"], ["intro.desc", "설명 (비우면 숨김)"], ["intro.button", "버튼"], ["intro.disclaimer", "안내 문구"]] });
    d.questions.forEach(function (q, i) {
      groups.push({ title: "질문 " + (i + 1) + " (" + q.aL + "/" + q.bL + ")", fields: [
        ["questions." + i + ".scene", "장면 이름"], ["questions." + i + ".q", "질문"],
        ["questions." + i + ".a", "A 선택지 (" + q.aL + ")"], ["questions." + i + ".b", "B 선택지 (" + q.bL + ")"]] });
    });
    Object.keys(d.genres).forEach(function (k) {
      var p = "genres." + k + ".";
      groups.push({ title: "결과: " + d.genres[k].name, fields: [
        [p + "nick", "별명"], [p + "ei", "외향/내향"], [p + "line", "결과 한 줄"], [p + "reason", "한 줄 이유"], [p + "traits", "성격"],
        [p + "music", "음악"], [p + "matchWhy", "찰떡궁합 이유 (" + (d.genres[d.genres[k].match] || {}).name + ")"],
        [p + "rivalWhy", "상극 이유 (" + (d.genres[d.genres[k].rival] || {}).name + ")"], [p + "spotOutfit", "현장 미션: 옷차림"], [p + "spotMove", "현장 미션: 동작"]] });
    });
    groups.push({ title: "결과 화면 공통", fields: [["result.matchLabel", "찰떡궁합 라벨"], ["result.rivalLabel", "상극 라벨"], ["result.missionTitle", "현장 미션 제목 ({genre} 자리에 장르명)"], ["result.retry", "다시 하기 버튼"]] });
    return groups;
  }
  function getPath(obj, path) { return path.split(".").reduce(function (o, k) { return o == null ? o : o[k]; }, obj); }
  function setPath(obj, path, v) { var ks = path.split("."), last = ks.pop(); ks.reduce(function (o, k) { return o[k]; }, obj)[last] = v; }

  function renderEditor() {
    var html = '<section class="editor"><h3>문구 편집</h3><p class="note" style="text-align:left">고친 내용은 위 미리보기에 바로 보이고, 저장하면 이 링크로 들어오는 모든 사람에게 반영돼요.</p>';
    fieldList().forEach(function (g, gi) {
      html += "<details" + (gi === 0 ? " open" : "") + "><summary>" + esc(g.title) + '</summary><div class="fields">';
      g.fields.forEach(function (f) {
        var id = "f-" + f[0].replace(/\./g, "-");
        html += '<div class="field"><label for="' + id + '">' + esc(f[1]) + '</label><textarea id="' + id + '" data-path="' + esc(f[0]) + '" rows="2">' + esc(getPath(draft, f[0])) + "</textarea></div>";
      });
      html += "</div></details>";
    });
    html += '<div class="save-row"><button type="button" class="primary" id="btn-save" style="width:auto;flex:1">저장하고 반영하기</button><span class="status" id="save-status"></span></div></section>';
    return html;
  }

  function render() {
    var body = state.screen === "intro" ? renderIntro() : state.screen === "q" ? renderQuestion() : renderResult();
    app.innerHTML = '<main class="wrap">' + editBar() + '<div id="view" style="display:flex;flex-direction:column;gap:20px">' + body + "</div>" + (editing ? renderEditor() : "") + "</main>";
    bind();
  }
  function renderView() {
    var v = document.getElementById("view");
    if (!v) return render();
    v.innerHTML = state.screen === "intro" ? renderIntro() : state.screen === "q" ? renderQuestion() : renderResult();
    bindView();
  }

  function bindView() {
    fitBreaks();
    var start = document.getElementById("btn-start");
    if (start) start.onclick = function () { state = { screen: "q", i: 0, answers: [], code: null }; renderView(); scrollTo(0, 0); };
    Array.prototype.forEach.call(document.querySelectorAll(".opt"), function (b) {
      b.onclick = function () {
        state.answers[state.i] = b.getAttribute("data-l");
        if (state.i < D().questions.length - 1) { state.i++; renderView(); }
        else { state.code = scoreCode(state.answers); state.screen = "result"; renderView(); scrollTo(0, 0); }
      };
    });
    var back = document.getElementById("btn-back");
    if (back) back.onclick = function () { state.i--; renderView(); };
    var retry = document.getElementById("btn-retry");
    if (retry) retry.onclick = function () { state = { screen: "intro", i: 0, answers: [], code: null }; renderView(); scrollTo(0, 0); };
  }
  function bind() {
    bindView();
    var e = document.getElementById("btn-edit");
    if (e) e.onclick = function () { draft = JSON.parse(JSON.stringify(DATA)); editing = true; render(); };
    var c = document.getElementById("btn-close-edit");
    if (c) c.onclick = function () { editing = false; draft = null; render(); };
    Array.prototype.forEach.call(document.querySelectorAll("textarea[data-path]"), function (t) {
      t.oninput = function () { setPath(draft, t.getAttribute("data-path"), t.value); renderView(); };
    });
    var s = document.getElementById("btn-save");
    if (s) s.onclick = save;
  }

  /* ---------- save: regenerate the whole page from data ---------- */
  function buildHtml(data) {
    var headStyle = document.head.querySelector("style");
    var reset = headStyle ? headStyle.textContent : "";
    var css = document.getElementById("app-style").textContent;
    var code = document.getElementById("app-code").textContent;
    var json = JSON.stringify(data, null, 2).replace(/</g, "\\u003c");
    var fonts = document.querySelector('link[rel="stylesheet"][href*="fonts.googleapis"]');
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + "</style></head><body>" +
      "<title>" + esc(document.title) + "</title>\n" +
      '<meta name="claude:viewport-fit-sides" content="cover">\n' +
      '<link rel="preconnect" href="https://fonts.googleapis.com">\n' +
      '<link rel="stylesheet" href="' + esc(fonts ? fonts.getAttribute("href") : "") + '">\n' +
      '<style id="app-style">' + css + "</style>\n" +
      '<div id="app"></div>\n' +
      '<script type="application/json" id="app-data">\n' + json + "\n<\/script>\n" +
      '<script type="application/json" id="app-art">' + JSON.stringify(ART).replace(/</g, "\\u003c") + "<\/script>\n" +
      '<script id="app-code">' + code + "<\/script>\n" +
      "</body></html>";
  }
  function save() {
    var st = document.getElementById("save-status"), btn = document.getElementById("btn-save");
    if (!artifactApi) { st.textContent = "이 화면에서는 저장할 수 없어요."; st.className = "status err"; return; }
    btn.disabled = true; st.className = "status"; st.textContent = "저장하는 중…";
    artifactApi.publish(buildHtml(draft)).then(function () {
      st.textContent = "저장했어요. 새 버전으로 다시 불러와요.";
    }).catch(function (err) {
      btn.disabled = false;
      var code = err && err.code;
      st.className = "status err";
      if (code === "conflict") st.textContent = "그사이 다른 수정이 저장돼서 최신 버전으로 다시 불러와요. 고친 내용을 다시 입력해 주세요.";
      else if (code === "not_writer" || code === "not_granted" || code === "not_declared" || code === "capability_disabled" || code === "consent_required") st.textContent = "편집 권한이 없어 저장할 수 없어요.";
      else if (code === "rate_limited") st.textContent = "저장을 너무 자주 했어요. 잠시 뒤에 다시 눌러 주세요.";
      else st.textContent = "저장하지 못했어요. 잠시 뒤에 다시 시도해 주세요.";
    });
  }

  render();

  if (window.claude && typeof window.claude.use === "function") {
    Promise.all([window.claude.use("user"), window.claude.use("artifact")]).then(function (res) {
      var user = res[0]; artifactApi = res[1];
      if (!user || !artifactApi) return;
      return user.canEdit().then(function (ok) { if (ok) { canEdit = true; render(); } });
    }).catch(function () {});
  }
})();
</script>
</body></html>
